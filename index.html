<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パチ・スロ確率チェッカー</title>
    <!-- 通信エラー対策：最も安定した配信元(cdnjs)から読み込み -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background: #f0f2f5; }
        h1 { font-size: 1.5rem; color: #333; }
        #video-container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; background: #000; border-radius: 10px; overflow: hidden; }
        video { width: 100%; display: block; }
        #guide-box { position: absolute; top: 35%; left: 10%; width: 80%; height: 30%; border: 3px solid #00ff00; box-sizing: border-box; pointer-events: none; }
        #guide-text { position: absolute; top: 10px; width: 100%; text-align: center; color: #00ff00; font-size: 0.8rem; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        button { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 5px; margin: 20px 0; width: 100%; max-width: 400px; cursor: pointer; }
        button:active { background: #0056b3; }
        #result-box { background: white; padding: 15px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: left; }
        .status { font-weight: bold; color: #666; text-align: center; }
        canvas { display: none; }
    </style>
</head>
<body>
    <h1>パチ・スロ確率チェッカー</h1>
    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <div id="guide-box"><div id="guide-text">ここに数字を合わせてね</div></div>
    </div>
    <button id="scan-btn">現在の画面をAI認識する</button>
    <div id="result-box">
        <p id="status-text" class="status">カメラを起動中...</p>
        <h3>【AI認識された数字】</h3>
        <p id="ocr-text" style="font-size: 1.2rem; font-weight: bold; color: #ff5722; background: #fff3e0; padding: 10px; border-radius: 5px; min-height: 30px;">（ここに結果が出ます）</p>
    </div>
    <canvas id="canvas"></canvas>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const scanBtn = document.getElementById('scan-btn');
        const statusText = document.getElementById('status-text');
        const ocrText = document.getElementById('ocr-text');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" } }, audio: false })
        .then(stream => { video.srcObject = stream; statusText.innerText = "カメラ準備完了！"; })
        .catch(err => {
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(stream => { video.srcObject = stream; statusText.innerText = "代替カメラ起動"; })
            .catch(e => { statusText.innerText = "カメラ起動失敗"; });
        });
        scanBtn.addEventListener('click', async () => {
            statusText.innerText = "AIを起動中...";
            scanBtn.disabled = true;
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            try {
                // Tesseractの初期化設定（エラー回避版）
                const worker = await Tesseract.createWorker();
                await worker.loadLanguage('eng');
                await worker.initialize('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: '0123456789' // 数字だけを読み取る
                });
                statusText.innerText = "画像を解析中...";
                const result = await worker.recognize(canvas);
                const num = result.data.text.replace(/[^0-9]/g, '').trim();
                if (num) {
                    ocrText.innerText = num;
                    statusText.innerText = "認識成功！";
                } else {
                    ocrText.innerText = "数字なし";
                    statusText.innerText = "もう一度試してね";
                }
                await worker.terminate();
            } catch (error) {
                statusText.innerText = "エラー: " + error.message;
            } finally {
                scanBtn.disabled = false;
            }
        });
    </script>
</body>
</html
